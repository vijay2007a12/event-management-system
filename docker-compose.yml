version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - eventhub-network

  db:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=eventhub
    volumes:
      - mongodb_data:/data/db
    networks:
      - eventhub-network

networks:
  eventhub-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
